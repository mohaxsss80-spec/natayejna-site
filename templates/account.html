<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#031613"><title>حسابي | نتائجنا</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#15553c 0,#062018 48%,#031613 100%);color:#f4fff6;font-family:Tahoma,Arial,sans-serif}.card{width:min(520px,100%);padding:28px;background:#0a1d16ed;border:1px solid #285b45;border-radius:20px;box-shadow:0 20px 70px #0007}.brand{color:#43e36b;font-weight:900;font-size:24px}h1{font-size:22px}.muted{color:#b4c8bb;line-height:1.7}.email{padding:12px 14px;border:1px solid #356b51;border-radius:10px;background:#06130f;direction:ltr;text-align:left;overflow-wrap:anywhere}.consent{display:flex;gap:10px;align-items:flex-start;margin:18px 0;color:#d6e7db;line-height:1.7;font-size:14px}.consent input{margin-top:5px;accent-color:#43e36b}.submit,.logout{padding:12px 16px;border:0;border-radius:10px;font:inherit;font-weight:800;cursor:pointer}.submit{background:#43e36b;color:#04120b}.logout{background:#123326;color:white;border:1px solid #356b51}.actions{display:flex;gap:10px;flex-wrap:wrap}.notice{background:#143824;color:#b9ffc9;padding:10px;border-radius:9px;margin:14px 0}.nav{color:#68ee88;display:inline-block;margin-top:18px}</style></head><body><main class="card"><div class="brand">نتائجنا</div><h1>حسابي</h1>
{% if created %}<div class="notice">تم إنشاء حسابك.</div>{% elif updated %}<div class="notice">تم حفظ إعداد مشاركة البريد.</div>{% endif %}
<p class="muted">بريد الحساب</p><div class="email">{{ user.email|e }}</div>
<form method="post" action="{{ url_for('account') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="consent"><input type="checkbox" name="share_email" {% if user.share_email %}checked{% endif %}><span>أوافق على إظهار بريدي الإلكتروني لمالك الموقع. يمكنني إلغاء الموافقة في أي وقت. لا تُشارك كلمة المرور أبداً.</span></label><div class="actions"><button class="submit" type="submit">حفظ إعداد المشاركة</button></div></form>
<form method="post" action="{{ url_for('logout') }}" style="margin-top:12px"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="logout" type="submit">تسجيل الخروج</button></form><a class="nav" href="{{ url_for('home') }}">العودة إلى الموقع</a></main></body></html>
