<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول لوحة التحكم</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#04100d,#0b261d);color:#f3fff5;font-family:Arial,Tahoma,sans-serif}.card{width:min(390px,calc(100% - 32px));background:#10241eee;border:1px solid #285b45;border-radius:20px;padding:28px;box-shadow:0 20px 70px #0006;text-align:center}.logo{font-size:48px;margin-bottom:8px}.card h1{margin:0 0 8px}.card p{color:#a5b9ad;line-height:1.7}.card input{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #2d624d;background:#06130f;color:#fff;font:inherit;margin:12px 0}.card button{width:100%;padding:13px;border:0;border-radius:10px;background:#43e36b;color:#05100a;font:inherit;font-weight:700}.error{background:#642d2d;color:#ffdede;padding:10px;border-radius:8px;margin:10px 0}.note{font-size:12px;color:#a5b9ad;margin-top:15px}</style></head>
<body><main class="card"><div class="logo">🔐</div><h1>لوحة تحكم نتائجنا</h1><p>هذه الصفحة خاصة بصاحب الموقع فقط.</p>{% if error %}<div class="error">{{ error|e }}</div>{% endif %}{% if configured %}<form method="post"><input name="password" type="password" placeholder="كلمة المرور" required autofocus><button type="submit">دخول</button></form>{% else %}<p class="note">لم يتم إعداد كلمة المرور بعد. أضف <b>ADMIN_PASSWORD</b> إلى Secrets ثم أعد فتح الصفحة.</p>{% endif %}<p><a href="{{ url_for('home') }}" style="color:#43e36b">العودة للموقع</a></p></main></body></html>
